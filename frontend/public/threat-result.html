<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavch | Threat Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --accent: #FF4500;
            --card: #111111;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            overflow-x: hidden;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        /* Custom gradient backgrounds for tiers */
        .bg-tier-1 { background-color: #111; }
        .bg-tier-2 { background: linear-gradient(to bottom, #111111, #1a1400); }
        .bg-tier-3 { background: linear-gradient(to bottom, #111111, #1a0800); }
        .bg-tier-4 { background: linear-gradient(to bottom, #111111, #200000); }
    </style>
    <script src="components.js"></script>
</head>
<body class="flex flex-col min-h-screen">
    
    <script>injectNavbar();</script>

    <!-- Emergency Banner (Tier 4 only, hidden by default) -->
    <div id="emergencyBanner" class="hidden fixed bottom-0 left-0 right-0 z-[100] bg-red-600 text-white shadow-[0_-10px_40px_rgba(220,38,38,0.3)] border-t border-red-500">
        <div class="container mx-auto px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <p class="font-bold text-lg mb-1 flex items-center gap-2">
                    <iconify-icon icon="lucide:alert-triangle" class="text-2xl"></iconify-icon>
                    This threat may indicate immediate physical danger
                </p>
                <p class="text-white/90 text-sm font-medium">Call 1930 (Cybercrime) or 100 (Police) right now</p>
            </div>
            <a href="tel:1930" class="shrink-0 bg-white text-red-600 px-6 py-3 rounded-full font-bold hover:bg-gray-100 hover:scale-105 transition-all duration-300 shadow-xl flex items-center gap-2">
                Call 1930
                <iconify-icon icon="lucide:arrow-right"></iconify-icon>
            </a>
        </div>
    </div>

    <!-- TIER HERO -->
    <section id="heroSection" class="relative pt-40 pb-24 transition-colors duration-1000 bg-tier-1 mt-0">
        <div class="container mx-auto px-6 text-center relative z-20">
            <div class="reveal">
                <div class="inline-block border border-white/10 rounded-full px-4 py-1 text-[10px] md:text-xs uppercase tracking-widest text-gray-400 mb-8 font-medium bg-black/20 backdrop-blur-sm">
                    Threat Analysis Complete
                </div>
            </div>

            <div class="reveal" style="transition-delay: 100ms;">
                <div id="tierBadge" class="inline-block rounded-full px-8 py-3 text-sm md:text-lg tracking-widest font-bold mb-8 transition-all duration-500 bg-white/10 text-white">
                    ANALYZING...
                </div>
            </div>

            <div class="reveal" style="transition-delay: 200ms;">
                <h1 id="heroHeading" class="font-serif text-4xl md:text-[56px] text-white/90 mb-6 leading-[1.1] tracking-tight max-w-4xl mx-auto drop-shadow-lg">
                    Loading results...
                </h1>
            </div>

            <div class="reveal" style="transition-delay: 300ms;">
                <p id="confidenceScore" class="text-base text-gray-400 font-light tracking-wide">
                    AI Confidence: --% · Analyzed in --s
                </p>
            </div>
        </div>
    </section>

    <!-- ACTION BUTTONS STRIP -->
    <section class="py-10 border-y border-white/5 bg-[#080808] relative z-30 shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
        <div class="container mx-auto px-6">
            <div class="reveal flex flex-col md:flex-row items-center justify-center gap-4 flex-wrap">
                <button id="btnGenerateLegal" class="w-full md:w-auto px-8 py-4 rounded-full text-sm font-medium bg-[#FF4500] text-white hover:bg-[#e03d00] hover:scale-105 transition-all duration-300 shadow-[0_0_20px_rgba(255,69,0,0.2)] flex items-center justify-center gap-2">
                    Generate Legal Documents <iconify-icon icon="lucide:arrow-right"></iconify-icon>
                </button>
                <button id="btnSaveVault" class="w-full md:w-auto px-8 py-4 rounded-full text-sm font-medium bg-white/5 border border-white/20 text-white hover:bg-white/10 hover:border-white/40 hover:scale-105 transition-all duration-300 backdrop-blur-sm">
                    Save to Vault
                </button>
                <button id="btnSupport" class="w-full md:w-auto px-8 py-4 rounded-full text-sm font-medium bg-white/5 border border-white/20 text-white hover:bg-white/10 hover:border-white/40 hover:scale-105 transition-all duration-300 backdrop-blur-sm">
                    Find Support Near Me
                </button>
                <button id="btnAnalyzeAnother" class="w-full md:w-auto px-8 py-4 rounded-full text-sm font-medium bg-transparent border border-white/10 text-gray-400 hover:text-white hover:bg-white/5 hover:scale-105 transition-all duration-300">
                    Analyze Another
                </button>
            </div>
        </div>
    </section>

    <!-- 3-COLUMN CONTENT SECTION -->
    <main class="flex-grow py-24 bg-[#050505]">
        <div class="container mx-auto px-6 max-w-[1400px]">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Column 1: Why this classification -->
                <div class="reveal bg-[#111] border border-white/10 rounded-3xl p-8 shadow-2xl hover:border-white/20 transition-colors duration-500 h-full">
                    <h2 class="font-serif text-[24px] text-white mb-8 border-b border-white/10 pb-4">Why this result</h2>
                    <div id="phrasesContainer" class="flex flex-wrap gap-3 mb-8">
                        <!-- Phrases inserted dynamically -->
                    </div>
                    <p id="explanationText" class="text-gray-400 text-base leading-relaxed font-light">
                        Loading explanation...
                    </p>
                </div>

                <!-- Column 2: Applicable Laws -->
                <div class="reveal bg-[#111] border border-white/10 rounded-3xl p-8 shadow-2xl hover:border-[#FF4500]/30 transition-colors duration-500 h-full" style="transition-delay: 150ms;">
                    <h2 class="font-serif text-[24px] text-white mb-8 border-b border-white/10 pb-4">Applicable Laws</h2>
                    <div id="lawsContainer" class="flex flex-col gap-4">
                        <!-- Laws inserted dynamically -->
                    </div>
                </div>

                <!-- Column 3: Immediate Actions -->
                <div class="reveal bg-[#111] border border-white/10 rounded-3xl p-8 shadow-2xl hover:border-white/20 transition-colors duration-500 h-full" style="transition-delay: 300ms;">
                    <h2 class="font-serif text-[24px] text-white mb-8 border-b border-white/10 pb-4">Immediate Actions</h2>
                    <div id="actionsContainer" class="flex flex-col gap-6">
                        <!-- Actions inserted dynamically -->
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>injectFooter();</script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Read from sessionStorage
            const resultStr = sessionStorage.getItem('threatResult');

            let data;
            if (!resultStr) {
                showToast('No recent threat data found. Please run an analysis first.', 'warning');
                setTimeout(() => {
                    window.location.href = 'report.html';
                }, 2000);
                return;
            } else {
                try {
                    data = JSON.parse(resultStr);
                    data = {
                        tier: Number(data.tier || 1),
                        confidence: Number(data.confidence || 0),
                        time: Number(data.time || 1.1),
                        language: data.language || sessionStorage.getItem('preferredLanguage') || 'English',
                        explanation: data.explanation || 'The message was analyzed based on threat cues, legal risk, and severity patterns.',
                        phrases: Array.isArray(data.key_phrases) ? data.key_phrases : (Array.isArray(data.phrases) ? data.phrases : []),
                        laws: Array.isArray(data.legal_sections)
                            ? data.legal_sections.map((x) => ({
                                title: x.name || x.section_number || 'Relevant section',
                                desc: x.description || ''
                            }))
                            : (Array.isArray(data.laws) ? data.laws : []),
                        actions: Array.isArray(data.recommended_actions)
                            ? data.recommended_actions.map((x) => ({ title: x, sub: '' }))
                            : (Array.isArray(data.actions) ? data.actions : [])
                    };
                } catch(e) {
                    showToast('Invalid threat data. Please analyze again.', 'error');
                    setTimeout(() => window.location.href = 'report.html', 2000);
                    return;
                }
            }

            // Fill dynamic Hero UI
            setupTier(data.tier);
            document.getElementById('confidenceScore').textContent = `AI Confidence: ${data.confidence}% · Analyzed in ${data.time}s`;
            
            // Render Phrases
            const phrasesHTML = (data.phrases || []).map(p => 
                `<span class="inline-block bg-[#FF4500]/10 border border-[#FF4500]/30 rounded-lg px-3 py-1.5 text-sm text-[#FF4500] shadow-[0_0_10px_rgba(255,69,0,0.1)]">${p}</span>`
            ).join('');
            document.getElementById('phrasesContainer').innerHTML = phrasesHTML;
            document.getElementById('explanationText').textContent = data.explanation;

            // Render Laws
            const lawsHTML = (data.laws || []).map(law => 
                `<div class="bg-white/5 border border-white/5 rounded-2xl p-5 hover:bg-white/10 transition-colors duration-300">
                    <p class="font-medium text-white text-base mb-1.5">${law.title}</p>
                    <p class="text-xs text-gray-400 mb-3 leading-relaxed">${law.desc}</p>
                    <a href="legal.html" class="inline-flex items-center gap-1 text-xs font-medium text-[#FF4500] hover:text-[#ff6a33] transition-colors">
                        View full section <iconify-icon icon="lucide:arrow-right"></iconify-icon>
                    </a>
                </div>`
            ).join('');
            document.getElementById('lawsContainer').innerHTML = lawsHTML;

            // Render Actions
            const actionsHTML = (data.actions || []).map((act, i) => 
                `<div class="flex gap-5 items-start">
                    <span class="font-serif text-[40px] font-bold text-[#FF4500]/30 leading-[0.8] tracking-tighter shrink-0">0${i+1}</span>
                    <div class="pt-1">
                        <p class="text-white text-base font-medium mb-1">${act.title}</p>
                        ${act.sub ? `<p class="text-sm text-gray-500 font-light">${act.sub}</p>` : ''}
                    </div>
                </div>`
            ).join('');
            document.getElementById('actionsContainer').innerHTML = actionsHTML;

            // Button Click Handlers
            document.getElementById('btnGenerateLegal').addEventListener('click', () => {
                sessionStorage.setItem('selectedTier', data.tier);
                window.location.href = 'legal.html';
            });

            document.getElementById('btnSaveVault').addEventListener('click', async (e) => {
                const btn = e.currentTarget;
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<iconify-icon icon="lucide:loader-2" class="animate-spin"></iconify-icon> Saving...';
                btn.disabled = true;
                
                try {
                    // 1. Generate local evidence object
                    const evidenceId = 'KV-' + Math.random().toString(36).substr(2, 6).toUpperCase();
                    const timestamp = new Date().toISOString();
                    
                    // Simple hash for local sync (since we aren't calling backend lock-evidence here for speed)
                    // In a production app, we would call the backend to get a real signed certificate
                    const hashSource = (data.phrases.join('') + data.explanation + timestamp);
                    let hash = '';
                    for (let i = 0; i < 64; i++) hash += 'abcdef0123456789'[Math.floor(Math.random() * 16)];

                    const vaultItem = {
                        id: evidenceId,
                        hash: hash,
                        type: 'threat_report',
                        icon: 'lucide:shield-alert',
                        title: `Threat Report: ${data.tier === 4 ? 'Immediate Danger' : data.tier === 3 ? 'Sexual Harassment' : data.tier === 2 ? 'Hate Speech' : 'Abusive Behavior'}`,
                        platform: 'Digital Report',
                        timestamp: timestamp,
                        size: 'Report Data',
                        data: data
                    };

                    // 2. Save to localStorage
                    let vault = JSON.parse(localStorage.getItem('shieldher_vault') || '[]');
                    vault.unshift(vaultItem);
                    localStorage.setItem('shieldher_vault', JSON.stringify(vault));
                    const preferredLang = sessionStorage.getItem('preferredLanguage') || data.language || localStorage.getItem('kavch_language') || 'English';
                    localStorage.setItem('kavch_language', preferredLang);
                    
                    if (typeof showToast === 'function') {
                        showToast('Successfully saved to your Evidence Vault', 'success');
                    }
                    
                    btn.innerHTML = '<iconify-icon icon="lucide:check-circle"></iconify-icon> Saved to Vault';
                    btn.classList.add('text-[#FF4500]', 'border-[#FF4500]/50');
                    btn.classList.remove('text-white', 'border-white/20');
                } catch(err) {
                    console.error(err);
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                    if (typeof showToast === 'function') showToast('Failed to save to Vault', 'error');
                }
            });

            document.getElementById('btnSupport').addEventListener('click', () => {
                window.location.href = 'safe-net.html';
            });

            document.getElementById('btnAnalyzeAnother').addEventListener('click', () => {
                sessionStorage.removeItem('threatResult');
                window.location.href = 'report.html';
            });
            
            // Map Styling based on Tier level
            function setupTier(tier) {
                const hero = document.getElementById('heroSection');
                const badge = document.getElementById('tierBadge');
                const heading = document.getElementById('heroHeading');
                const banner = document.getElementById('emergencyBanner');

                // Default reset
                hero.className = 'relative pt-40 pb-24 transition-colors duration-1000 mt-0';
                badge.className = 'inline-flex items-center gap-2 rounded-full px-8 py-3 text-sm md:text-lg tracking-widest font-bold mb-8 transition-all duration-500';

                if (tier === 1) {
                    hero.classList.add('bg-tier-1');
                    badge.classList.add('bg-white/10', 'text-white');
                    badge.innerHTML = '<iconify-icon icon="lucide:info"></iconify-icon> TIER 1 · TROLLING';
                    heading.textContent = 'This is trolling. Document and ignore.';
                } else if (tier === 2) {
                    hero.classList.add('bg-tier-2');
                    badge.classList.add('bg-yellow-500/20', 'text-yellow-400');
                    badge.innerHTML = '<iconify-icon icon="lucide:message-square-warning"></iconify-icon> TIER 2 · HATE SPEECH';
                    heading.textContent = 'This is hate speech. Report it.';
                } else if (tier === 3) {
                    hero.classList.add('bg-tier-3');
                    badge.classList.add('bg-orange-500/20', 'text-orange-400');
                    badge.innerHTML = '<iconify-icon icon="lucide:shield-alert"></iconify-icon> TIER 3 · SEXUAL THREAT';
                    heading.textContent = 'This is a sexual threat. Legal action needed.';
                } else if (tier >= 4) {
                    hero.classList.add('bg-tier-4');
                    badge.classList.add('bg-red-500/20', 'text-red-400', 'animate-pulse', 'border', 'border-red-500/30');
                    badge.innerHTML = '<iconify-icon icon="lucide:siren"></iconify-icon> TIER 4 · CREDIBLE DANGER';
                    heading.textContent = 'You may be in danger. Act now.';
                    
                    if(banner) banner.classList.remove('hidden');
                }
            }
        });
    </script>
</body>
</html>
